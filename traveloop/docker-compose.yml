version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: traveloop-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=traveloop
      - POSTGRES_PASSWORD=traveloop_secret
      - POSTGRES_DB=traveloop
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveloop"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: traveloop-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://traveloop:traveloop_secret@postgres:5432/traveloop
      - JWT_SECRET=your_jwt_secret_here
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traveloop-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
